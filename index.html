<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WFM Acarrion - Login Asesores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { dark: '#001E54', mid: '#004F7A', teal: '#00A29F', light: '#E6F6F6' } } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans p-4 flex items-center justify-center min-h-screen">

    <!-- VISTA 1: LOGIN -->
    <div id="login-screen" class="max-w-md w-full bg-white rounded-xl shadow-lg p-6 border-t-8 border-brand-dark">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-brand-dark tracking-tighter">carrión</h1>
            <p class="text-brand-teal font-semibold tracking-[0.3em] text-xs mb-6">EDUCACIÓN SUPERIOR</p>
            <h2 class="text-xl font-bold text-gray-700">Portal del Asesor</h2>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">Correo Institucional</label>
                <input type="email" id="email" placeholder="ejemplo@acarrion.edu.pe" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-brand-teal focus:outline-none bg-gray-50">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">Contraseña</label>
                <input type="password" id="password" placeholder="********" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-brand-teal focus:outline-none bg-gray-50">
            </div>
            <button onclick="iniciarSesion()" id="btn-login" class="w-full bg-brand-dark hover:bg-brand-mid text-white font-bold py-3 px-4 rounded-lg text-sm transition-colors shadow-sm">
                Ingresar al Sistema
            </button>
        </div>
    </div>

    <!-- VISTA 2: APP (Oculta por defecto) -->
    <div id="app-screen" class="max-w-md w-full bg-white rounded-xl shadow-lg p-6 border-t-8 border-brand-dark hidden">
        <div class="flex justify-between items-center mb-4 pb-4 border-b">
            <div>
                <p class="text-xs text-gray-500 font-bold uppercase">Bienvenido(a)</p>
                <h1 class="text-lg font-extrabold text-brand-dark" id="nombre-agente">Cargando...</h1>
            </div>
            <div class="flex items-center gap-2">
                <!-- BOTÓN DE VOZ -->
                <button id="btn-voz-agente" onclick="toggleVozAgente()" class="text-xs text-brand-dark font-bold bg-gray-100 px-2 py-1 rounded hover:bg-gray-200 transition">🔊</button>
                <button onclick="cerrarSesion()" class="text-xs text-red-500 font-bold bg-red-50 px-3 py-1.5 rounded hover:bg-red-100 transition">Salir</button>
            </div>
        </div>

        <!-- RECUADRO: HORARIO DEL DÍA -->
        <div class="mb-4 p-4 bg-brand-light rounded-lg border border-brand-teal/30 flex items-center justify-between shadow-sm">
            <div>
                <p class="text-xs font-bold text-brand-teal uppercase tracking-wider mb-1">Mi turno de hoy</p>
                <p class="text-sm font-bold text-brand-dark" id="horario-info">Cargando horario...</p>
            </div>
            <div class="text-2xl">📅</div>
        </div>

        <!-- RECUADRO: CONTROL DE TURNO -->
        <div class="mb-5 p-4 bg-gray-50 rounded-lg border border-gray-200 shadow-sm text-center">
            <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Control de Jornada</p>
            <button id="btn-iniciar-turno" onclick="iniciarTurno()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-2 rounded-lg text-sm transition-colors shadow-sm">
                ⏰ Iniciar Turno
            </button>
            <button id="btn-finalizar-turno" onclick="finalizarTurno()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-2 rounded-lg text-sm transition-colors shadow-sm hidden">
                🚪 Finalizar Turno
            </button>
            <p id="estado-jornada" class="text-xs font-bold text-gray-500 mt-2"></p>
        </div>

        <div class="mb-5">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Auxiliares (Pausas)</p>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="registrarAuxiliar('baño')" class="bg-brand-teal hover:bg-teal-600 text-white font-bold py-2 px-2 rounded-lg text-sm transition-colors shadow-sm">🚽 Baño</button>
                <button onclick="registrarAuxiliar('almuerzo')" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-2 rounded-lg text-sm transition-colors shadow-sm">🍽️ Almuerzo</button>
                <button onclick="registrarAuxiliar('capacitacion')" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-2 rounded-lg text-sm transition-colors shadow-sm">📚 Capacitación</button>
                <button onclick="volverDeAuxiliar()" class="bg-brand-mid hover:bg-blue-800 text-white font-bold py-2 px-2 rounded-lg text-sm transition-colors shadow-sm border-2 border-brand-dark">✅ Volver</button>
            </div>
        </div>

        <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Eventos / Ausencias</p>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="registrarAusencia('falta')" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-2 rounded-lg text-sm transition-colors shadow-sm">❌ Falta</button>
                <button onclick="registrarAusencia('retiro')" class="bg-gray-700 hover:bg-gray-800 text-white font-bold py-2 px-2 rounded-lg text-sm transition-colors shadow-sm">🏃 Retiro</button>
            </div>
        </div>

        <div id="mensaje" class="mt-4 text-sm text-center font-bold text-green-700 hidden p-3 bg-green-50 rounded-lg border border-green-200"></div>
    </div>

    <script>
        const supabaseUrl = 'https://euidaqedhovrojkfbhhx.supabase.co';
        const supabaseKey = 'sb_publishable_JrNGn7Is4s04Gd8QjqElag_dXaqiF3s'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let agenteActualId = null;
        let nombreAgenteActual = "";
        const fechaHoy = new Date().toISOString().split('T')[0];

        // --- VARIABLES PARA EL CONTROL DE VOZ Y TIEMPO ---
        let vozActivadaAgente = true;
        let intervaloTiempoAuxiliar = null;
        let horaInicioAuxiliar = null;
        let limiteAuxiliarMinutos = 0;
        let tipoAuxiliarActual = "";
        let ultimoMinutoAvisado = -1;

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) mostrarApp(session.user);
        });

        supabaseClient.auth.onAuthStateChange((_event, session) => {
            if (session) mostrarApp(session.user);
            else ocultarApp();
        });

        async function iniciarSesion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            
            if (!email.endsWith('@acarrion.edu.pe')) return alert("Debes usar tu correo @acarrion.edu.pe");

            btn.textContent = "Verificando...";
            btn.disabled = true;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            btn.textContent = "Ingresar al Sistema";
            btn.disabled = false;

            if (error) alert("Error al ingresar: " + error.message);
        }

        async function cerrarSesion() { await supabaseClient.auth.signOut(); }

        async function mostrarApp(user) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');

            const { data } = await supabaseClient.from('agentes').select('id, nombre').eq('user_id', user.id).single();
            
            if (data) {
                agenteActualId = data.id;
                nombreAgenteActual = data.nombre;
                document.getElementById('nombre-agente').textContent = data.nombre;

                // Cargar Horario
                const { data: horario } = await supabaseClient.from('plan_diario')
                    .select('hora_inicio, hora_fin, canal')
                    .eq('agente_id', agenteActualId)
                    .eq('fecha', fechaHoy)
                    .single();

                const infoHorario = document.getElementById('horario-info');
                if (horario) {
                    infoHorario.innerHTML = `<span class="text-brand-teal font-extrabold text-base">${horario.hora_inicio.substring(0,5)} - ${horario.hora_fin.substring(0,5)}</span> | Canal: <span class="uppercase font-bold">${horario.canal}</span>`;
                } else {
                    infoHorario.textContent = "Día libre / No asignado";
                    infoHorario.classList.add('text-gray-400');
                }

                // Cargar Estado de Jornada y Pausas Activas
                verificarEstadoJornada();
                verificarPausaActivaAlRecargar();

            } else {
                document.getElementById('nombre-agente').textContent = "Supervisor / Admin";
                document.getElementById('horario-info').textContent = "Modo Administrador";
            }
        }

        function ocultarApp() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            if (intervaloTiempoAuxiliar) clearInterval(intervaloTiempoAuxiliar);
        }

        function mostrarMensaje(texto, color = "green") {
            const msgDiv = document.getElementById('mensaje');
            msgDiv.textContent = texto;
            msgDiv.className = `mt-4 text-sm text-center font-bold text-${color}-700 p-3 bg-${color}-50 rounded-lg border border-${color}-200`;
            msgDiv.classList.remove('hidden');
            setTimeout(() => msgDiv.classList.add('hidden'), 3500);
        }

        // --- LÓGICA DE VOZ DEL ASESOR ---
        function toggleVozAgente() {
            vozActivadaAgente = !vozActivadaAgente;
            const btn = document.getElementById('btn-voz-agente');
            if (vozActivadaAgente) {
                btn.innerHTML = "🔊";
                btn.classList.remove('bg-red-100', 'text-red-600');
                btn.classList.add('bg-gray-100', 'text-brand-dark');
            } else {
                btn.innerHTML = "🔇";
                btn.classList.add('bg-red-100', 'text-red-600');
                btn.classList.remove('bg-gray-100', 'text-brand-dark');
                window.speechSynthesis.cancel();
            }
        }

        function alertarVozExceso(minutosTotales, minutosExceso) {
            if (!vozActivadaAgente) return;
            if (!('speechSynthesis' in window)) return;

            const msg = new SpeechSynthesisUtterance(`Atención ${nombreAgenteActual}. Recuerda que el auxiliar de ${tipoAuxiliarActual} tiene un límite de ${limiteAuxiliarMinutos} minutos. Llevas ${minutosExceso} minutos en exceso. Por favor, marca Volver a laborar.`);
            msg.lang = 'es-ES';
            msg.rate = 1.0;
            window.speechSynthesis.speak(msg);
        }

        function iniciarContadorAuxiliar(tipo, horaInicioStr) {
            if (intervaloTiempoAuxiliar) clearInterval(intervaloTiempoAuxiliar);
            
            tipoAuxiliarActual = tipo;
            horaInicioAuxiliar = new Date(horaInicioStr);
            ultimoMinutoAvisado = -1;

            // Definimos los límites (puedes cambiarlos aquí)
            if (tipo === 'baño') limiteAuxiliarMinutos = 15;
            else if (tipo === 'almuerzo') limiteAuxiliarMinutos = 60;
            else if (tipo === 'capacitacion') limiteAuxiliarMinutos = 60;

            // Empezar a revisar cada 10 segundos
            intervaloTiempoAuxiliar = setInterval(() => {
                const ahora = new Date();
                const minutosTranscurridos = Math.floor((ahora - horaInicioAuxiliar) / 60000);
                
                if (minutosTranscurridos > limiteAuxiliarMinutos) {
                    const exceso = minutosTranscurridos - limiteAuxiliarMinutos;
                    // Solo avisa una vez por cada minuto nuevo
                    if (ultimoMinutoAvisado !== minutosTranscurridos) {
                        alertarVozExceso(minutosTranscurridos, exceso);
                        ultimoMinutoAvisado = minutosTranscurridos;
                    }
                }
            }, 10000); // Revisa cada 10 segundos
        }

        async function verificarPausaActivaAlRecargar() {
            if (!agenteActualId) return;
            const { data: activos } = await supabaseClient.from('status_events')
                .select('*')
                .eq('agente_id', agenteActualId)
                .is('fin', null)
                .maybeSingle();

            if (activos) {
                // El asesor recargó la página pero sigue en pausa, retomamos el contador
                iniciarContadorAuxiliar(activos.estado, activos.inicio);
            }
        }

        // --- LÓGICA DE JORNADA ---
        async function verificarEstadoJornada() {
            if (!agenteActualId) return;

            const { data } = await supabaseClient.from('registro_jornada')
                .select('*')
                .eq('agente_id', agenteActualId)
                .eq('fecha', fechaHoy)
                .single();

            const btnIniciar = document.getElementById('btn-iniciar-turno');
            const btnFinalizar = document.getElementById('btn-finalizar-turno');
            const txtEstado = document.getElementById('estado-jornada');

            if (!data) {
                btnIniciar.classList.remove('hidden');
                btnFinalizar.classList.add('hidden');
                txtEstado.textContent = "No has iniciado tu turno aún.";
            } else if (data && !data.hora_fin_real) {
                btnIniciar.classList.add('hidden');
                btnFinalizar.classList.remove('hidden');
                let horaInicio = new Date(data.hora_inicio_real).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                txtEstado.innerHTML = `<span class="text-green-600">Turno iniciado a las ${horaInicio}</span>`;
            } else if (data && data.hora_fin_real) {
                btnIniciar.classList.add('hidden');
                btnFinalizar.classList.add('hidden');
                txtEstado.innerHTML = `<span class="text-gray-400">Turno finalizado por hoy ✔️</span>`;
            }
        }

        async function iniciarTurno() {
            if (!agenteActualId) return;
            
            const { error } = await supabaseClient.from('registro_jornada').insert([{
                agente_id: agenteActualId,
                fecha: fechaHoy,
                hora_inicio_real: new Date().toISOString()
            }]);

            if (error) return alert("Error al iniciar turno: " + error.message);
            
            mostrarMensaje("Turno iniciado correctamente", "green");
            verificarEstadoJornada();
        }

        async function finalizarTurno() {
            if (!agenteActualId) return;
            
            const { error } = await supabaseClient.from('registro_jornada').update({
                hora_fin_real: new Date().toISOString()
            }).eq('agente_id', agenteActualId).eq('fecha', fechaHoy);

            if (error) return alert("Error al finalizar turno: " + error.message);
            
            mostrarMensaje("Turno finalizado correctamente", "red");
            verificarEstadoJornada();
        }

        // --- LÓGICA DE PAUSAS Y AUSENCIAS ---
        async function registrarAuxiliar(estado) {
            if (!agenteActualId) return alert("No se encontró tu perfil de agente.");

            const { data: activos } = await supabaseClient.from('status_events').select('id').eq('agente_id', agenteActualId).is('fin', null);
            if (activos && activos.length > 0) return alert("Ya tienes una pausa activa. Debes marcar 'Volver' primero.");

            const horaSalida = new Date().toISOString();

            const { error } = await supabaseClient.from('status_events').insert([{ agente_id: agenteActualId, estado: estado, inicio: horaSalida }]);
            if (error) return alert("Error: " + error.message);
            
            mostrarMensaje(`Salida a ${estado.toUpperCase()} registrada`, "teal");
            
            // Iniciar temporizador y voz
            iniciarContadorAuxiliar(estado, horaSalida);
        }

        async function volverDeAuxiliar() {
            if (!agenteActualId) return;

            const { data: activos, error } = await supabaseClient
                .from('status_events')
                .update({ fin: new Date().toISOString() })
                .eq('agente_id', agenteActualId)
                .is('fin', null)
                .select();

            if (error) return alert("Error: " + error.message);
            if (activos.length === 0) return alert("No tienes ninguna pausa activa pendiente.");
            
            mostrarMensaje("Regreso a laborar registrado", "blue");

            // Detener temporizador y voz
            if (intervaloTiempoAuxiliar) clearInterval(intervaloTiempoAuxiliar);
            window.speechSynthesis.cancel(); // Detener cualquier voz en curso
            horaInicioAuxiliar = null;
            ultimoMinutoAvisado = -1;
        }

        async function registrarAusencia(tipo) {
            if (!agenteActualId) return;

            const { error } = await supabaseClient.from('ausencias').insert([{ agente_id: agenteActualId, fecha: fechaHoy, tipo: tipo, motivo: 'Web App' }]);
            
            if (error) return alert("Error: " + error.message);
            mostrarMensaje(`Registro de ${tipo.toUpperCase()} guardado`, "red");
        }
    </script>
</body>
</html>
